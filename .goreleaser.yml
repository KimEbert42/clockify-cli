version: 2

project_name: clockify

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: clockify
    main: ./cmd/clockify
    binary: clockify
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

universal_binaries:
  - id: clockify
    replace: true
    ids:
      - clockify

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: kim
    name: clockify-cli
  draft: false
  prerelease: auto

brews:
  - repository:
      owner: kim
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/kim/clockify-cli
    description: Command-line interface for Clockify time tracking
    license: MIT
    install: |
      bin.install "clockify"
    test: |
      system "#{bin}/clockify", "version"

snapshot:
  version_template: "{{ incpatch .Version }}-next"
